# TennisAI on a self-hosted server. Three containers, one origin:
#
#   caddy (web)  :80/:443  -> serves the SPA, proxies /api to the API
#   api                    -> Express + Prisma, not reachable from outside
#   db                     -> PostgreSQL, not reachable from outside
#
# Deliberately its own compose project ("tennisai") with its own network, so it
# shares nothing with the NOOMA bot already running on this machine.
#
#   cd /opt/tennisai/deploy/hetzner
#   docker compose up -d --build
name: tennisai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Cap the log driver. Without this Docker keeps every line forever; the
    # api's access log grows with traffic and nothing on this 38 GB disk would
    # say so until it was full. Set PER SERVICE rather than in
    # /etc/docker/daemon.json on purpose: daemon.json needs a daemon restart,
    # which would take the NOOMA bot on the same host down with it. Takes
    # effect when compose next recreates the container, i.e. the next deploy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: tennisai
      POSTGRES_DB: tennisai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NO ports section, on purpose. Publishing 5432 would expose the database
    # to the internet; the API reaches it over the compose network instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennisai -d tennisai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../server
    restart: unless-stopped
    # Cap the log driver. Without this Docker keeps every line forever; the
    # api's access log grows with traffic and nothing on this 38 GB disk would
    # say so until it was full. Set PER SERVICE rather than in
    # /etc/docker/daemon.json on purpose: daemon.json needs a daemon restart,
    # which would take the NOOMA bot on the same host down with it. Takes
    # effect when compose next recreates the container, i.e. the next deploy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://tennisai:${POSTGRES_PASSWORD}@db:5432/tennisai
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 1d
      # Used for links inside emails and as the CORS origin. Same host as the
      # site itself, which is why cross-origin never enters into it.
      APP_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      # The age of digital consent this deployment enforces. 14 is Spain's
      # (LOPDGDD Art. 7) and matches the code's default.
      #
      # It is passed explicitly because it was NOT reachable before. The code
      # reads MINOR_AGE_THRESHOLD from the environment per call, and the legal
      # pages tell the reader it can be changed by the operator — but this file
      # never passed it, and server/.dockerignore keeps `.env` out of the
      # image, so dotenv found nothing inside the container. The knob the
      # policy described did not exist. Now it does.
      #
      # CHANGING THIS IS NOT ONLY A DEPLOYMENT CHANGE. The privacy policy and
      # the terms state this age to the reader in both languages, and
      # server/src/auth/__tests__/ageInLegalCopy.test.ts holds that copy to the
      # code's default. A deployment that sets a different number here has a
      # policy that lies to its users until the copy is changed too.
      MINOR_AGE_THRESHOLD: ${MINOR_AGE_THRESHOLD:-14}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TennisAI}
      # Any SMTP provider, for when Gmail cannot issue an app password.
      # SMTP_HOST alone switches it on; Gmail wins if both are configured.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAX_SIGNUPS: ${MAX_SIGNUPS:-}
      # Shared secret for the CI calendar ingest. Blank = endpoint switched off.
      FEED_PUSH_TOKEN: ${FEED_PUSH_TOKEN:-}
      FEED_REFRESH_HOUR_UTC: ${FEED_REFRESH_HOUR_UTC:-4}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Uploaded profile photos. They live on the volume below — not in the
      # image, and nowhere Caddy serves. Every read goes through the API, which
      # authorises the caller (server/src/photos/).
      UPLOADS_DIR: /data/uploads
      # Where the coaching library finds its skills, patterns and drills.
      #
      # It has to be stated rather than inferred. This image is built from
      # `server/`, so the repository's content/ directory is not inside it, and
      # the code's own fallback — three levels above src/library — resolves to
      # the repository root in a checkout but to `/` in the container. On
      # 2026-09-07 that combination took the production API down: it threw
      # ENOENT for /content/schema/skills.yaml at import and restart-looped,
      # with every request behind it failing, while the site itself kept
      # serving. Both this variable and the mount below are required.
      CONTENT_DIR: /content
    volumes:
      # THE ONE STRUCTURAL CHANGE IN THIS BRANCH. Worth reading rather than
      # skimming, because profile photos are the first thing this product
      # stores that is NOT in the database:
      #
      #   * without this volume every photo is lost on the next
      #     `docker compose up --build`, and silently — the database rows
      #     survive and only the files go, so the app looks fine until someone
      #     notices every avatar has turned back into initials;
      #   * `pg_dump` does not see these files, so the documented backup would
      #     no longer cover everything the product holds. backup.sh archives
      #     this directory alongside the dump, and RESTORE.md restores both.
      - uploads:/data/uploads
      # The coaching content, read-only, from the checkout this stack is
      # deployed from. `update.sh` resets that checkout to the same commit the
      # image is built from, so the two cannot drift apart. Read-only because
      # nothing in the API ever writes here — content changes arrive through a
      # reviewed pull request, not at runtime.
      - ../../content:/content:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/hetzner/Dockerfile.web
      args:
        # Relative, so the bundle calls whatever host it was served from. The
        # site can be renamed later without rebuilding for a new API hostname.
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    # Cap the log driver. Without this Docker keeps every line forever; the
    # api's access log grows with traffic and nothing on this 38 GB disk would
    # say so until it was full. Set PER SERVICE rather than in
    # /etc/docker/daemon.json on purpose: daemon.json needs a daemon restart,
    # which would take the NOOMA bot on the same host down with it. Takes
    # effect when compose next recreates the container, i.e. the next deploy.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates and Caddy state must survive a rebuild — Let's Encrypt
      # rate-limits issuance, so re-requesting on every deploy would eventually
      # lock the site out of HTTPS.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  # Profile photos. NEW in the player-profile-photos change, and the only
  # store outside PostgreSQL — see the note on the api service's volume and
  # RESTORE.md's "Restoring the uploaded files".
  uploads:
